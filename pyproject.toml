[project]
name = "brokilon"
version = "0.1.0"
authors = [
  { name="Lars Berling", email="berlinglars96@gmail.com" },
]
description = "A python package for phylogenetics, variations of conditional cladedistributions"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy",
    "click",
    "pandas"
]

[project.optional-dependencies]
dev = [
  "pytest"
]

[project.urls]
Homepage = "https://github.com/Lars-B/pyccd"
Issues = "https://github.com/Lars-B/pyccd/issues"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brokilon"]

[project.scripts]
transcope = "brokilon.ccd.cli.transcope:main"
datesWIW = "brokilon.ccd.domain.wiw_date_data:main"
ccdMAP = "brokilon.ccd.cli.ccd_map_cli:main"
geography = "brokilon.ccd.cli.geography:main"
mrc = "brokilon.majority_rule_consensus.cli:mrc"
